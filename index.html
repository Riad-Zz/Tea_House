<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House</title>
    <!--Font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <!--Tailwind css-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!--Css file-->
    <link rel="stylesheet" href="styles/style.css">
    <!--Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body class="Primary-font bg-[#FAF9F6]">
    <!--Heading Section-->
    <header class="heading-section max-area">
        <!--Navigation Bar-->
        <nav class="navigation-bar flex justify-between items-center">
            <div class="nav-log">
                <img src="/assets/logo.png" alt="Tea House Logo" class="h-30 w-30">
            </div>
            <div class="nav-mid text-xl font-medium">
                <ul class="nav-items hidden md:flex justify-between">
                    <li class="items mr-10 hover:text-orange-400"><a href="#">Home</a></li>
                    <li class="items mr-10 hover:text-orange-400""><a href="#">About</a></li>
                    <li class="items mr-10 hover:text-orange-400""><a href="#">Facilities</a></li>
                    <li class="items mr-10 hover:text-orange-400""><a href="#">Shop</a></li>
                </ul>
            </div>
            <div class="nv-right">
                <button class="nav-btn btn mr-[1.875rem] lg::mr-0">Login</button>
            </div>
        </nav>
        <section class="banner-section max-area flex flex-col-reverse items-center lg:flex-row justify-between mb-[120px]">
            <div class="banner-text  text-center lg:text-left lg:ml-5">
                <p class="title font-[800] text-[4.5rem] text-[rgba(28, 28, 28, 1)]">It's good <br>tea time at The <br> Tea House</p>
                <p class="sub-title font-[300] text-[1.125rem] text-[rgba(119, 119, 119, 1)] mt-8 mb-8">Tea and Botanical Solutions Supplier Give Optimum </br> Satisfaction To Your Taste Buds.</p>
                <button class="btn">Explore More</button>
            </div>
            
            <div class="banner-image relative">
                <img src="./assets/banner.png" alt="Tea Cup Image" class="mt-[30px] mb-[20px] lg:relative top-20 order-1"><div class="rating hidden w-[255px] h-[100px] gap-2.5 items-center rounded-2xl shadow-2xl absolute lg:flex -order-2 bg-white left-[80px] top-[480px]">
                    <div class="star-icon">
                        <i class="fa-solid fa-star text-3xl ml-7"></i>
                    </div>
                    <div class="txt">
                        <p class="font-[800] text-[1.875rem]">5.00</p>
                        <p class="font-[300] text-[1rem]">Trust Pilot Ratings</p>
                    </div>
                </div>
                
            </div>
        </section>
        
    </header>
</body>
</html>
